<!DOCTYPE html>
<html lang="en">
<head>

  <title>NEXUS Mesh - INF-02 FinTech Architecture</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-4 sm:p-8 font-sans">
  <header class="text-center mb-8">
    <h1 class="text-2xl sm:text-4xl font-black text-yellow-400 tracking-[0.2em] mb-2 drop-shadow-[0_0_15px_rgba(250,204,21,0.3)]">

    <div class="mt-8 p-4">

  <footer class="mt-12 text-center text-gray-500 font-mono text-[10px] sm:text-xs">
    <p class="mb-1">Protocol Engineer: Pranav Dilip Nimje &nbsp;|&nbsp; Team Agni</p>

  </footer>
