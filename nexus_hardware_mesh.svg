<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Background -->
  <rect width="100%" height="100%" fill="#0f172a" rx="10"/>
  
  <!-- Dashed Connecting Lines -->
  <line x1="150" y1="100" x2="650" y2="100" stroke="#334155" stroke-width="4" stroke-dasharray="8,8"/>

  <!-- Node 1: Client -->
  <g transform="translate(50, 75)">
    <rect width="100" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="50" y="30" fill="#93c5fd" font-family="monospace" font-size="14" text-anchor="middle">1. Client</text>
  </g>
  
  <!-- Node 2: Resource Server -->
  <g transform="translate(250, 75)">
    <rect width="100" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="50" y="30" fill="#fcd34d" font-family="monospace" font-size="14" text-anchor="middle">2. API</text>
  </g>

  <!-- Node 3: NEXUS Mesh -->
  <g transform="translate(450, 75)">
    <rect width="100" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="50" y="30" fill="#6ee7b7" font-family="monospace" font-size="14" text-anchor="middle">3. Mesh</text>
  </g>

  <!-- Node 4: Algorand -->
  <g transform="translate(650, 75)">
    <rect width="100" height="50" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <text x="50" y="30" fill="#67e8f9" font-family="monospace" font-size="14" text-anchor="middle">4. Algorand</text>
  </g>

  <!-- Animated Data Pulse (Inner Core) -->
  <circle cx="150" cy="100" r="6" fill="#10b981">
    <animate attributeName="cx" values="150; 250; 250; 450; 450; 650; 650; 150" keyTimes="0; 0.2; 0.3; 0.5; 0.6; 0.8; 0.9; 1" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Animated Data Pulse (Outer Glow) -->
  <circle cx="150" cy="100" r="12" fill="#10b981" opacity="0.4">
    <animate attributeName="cx" values="150; 250; 250; 450; 450; 650; 650; 150" keyTimes="0; 0.2; 0.3; 0.5; 0.6; 0.8; 0.9; 1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="12; 18; 12" dur="1s" repeatCount="indefinite"/>
  </circle>
</svg>
